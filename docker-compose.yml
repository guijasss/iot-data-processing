x-common-resources: &common-resources
  deploy:
    resources:
      limits:
        cpus: '0.25'
        memory: 256m

x-common-networks: &common-networks
  networks:
    - edge-net
    - shared-net

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    hostname: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    <<: [*common-networks, *common-resources]

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    hostname: influx
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=yourpassword
      - DOCKER_INFLUXDB_INIT_ORG=yourorg
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data
    <<: *common-networks
    volumes:
      - influxdb_data:/var/lib/influxdb2

#  telegraf:
#    image: telegraf:1.30
#    container_name: telegraf
#    hostname: telegraf
#    restart: unless-stopped
#    group_add:
#      - 1001 # docker group
#    env_file:
#      - .env
#    environment:
#      - INFLUX_URL=${CLOUD_INFLUX_URL}
#      - INFLUX_TOKEN=${CLOUD_INFLUX_TOKEN}
#      - INFLUX_ORG=${CLOUD_INFLUX_ORG}
#      - INFLUX_BUCKET=${CLOUD_INFLUX_BUCKET}
#      - HIVEMQ_USER=${MQTT_USERNAME}
#      - HIVEMQ_PASS=${MQTT_PASSWORD}
#    volumes:
#      - ./config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#    depends_on:
#      - influxdb
#    <<: *common-networks

  datagen:
    container_name: datagen
    networks:
      - edge-net
    build:
      context: .
      dockerfile: datagen/Dockerfile
    volumes:
      - ./datagen:/app/datagen
      - ./common:/app/common
      - ./logs:/app/logs
      - .env:/app/.env
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER=mqtt-broker
    command: ["tail", "-f", "/dev/null"]

  processing:
    container_name: processing
    build:
      context: .
      dockerfile: processing/Dockerfile
    volumes:
      - ./processing:/app/processing
      - ./common:/app/common
      - ./logs:/app/logs
      - .env:/app/.env
    depends_on:
      - mqtt-broker
      - influxdb
    environment:
      - MQTT_BROKER=mqtt-broker
    <<: [*common-networks, *common-resources]
    command: ["tail", "-f", "/dev/null"]

networks:
  edge-net:
    driver: bridge
  shared-net:
    external: true

volumes:
  influxdb_data:
